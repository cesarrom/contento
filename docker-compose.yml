version: "3.9"

# NOTE: Authentik is expected to be provided externally.
# PostgreSQL can be provided externally via DATABASE_URL, or you can use the optional
# local `postgres` service (enabled via the `local` profile).

services:
  # ─── PostgreSQL (optional local DB) ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["local"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contento}
      POSTGRES_USER: ${POSTGRES_USER:-contento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contento}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal_net

  # ─── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_minio}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal_net

  # ─── imgproxy ───────────────────────────────────────────────────────────────
  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:latest
    restart: unless-stopped
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      # Read images from MinIO via S3
      IMGPROXY_USE_S3: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-changeme_minio}
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_REGION: us-east-1
      IMGPROXY_S3_FORCE_PATH_STYLE: "true"
      # Security & quality
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
      IMGPROXY_JPEG_PROGRESSIVE: "true"
      IMGPROXY_AUTO_ROTATE: "true"
      IMGPROXY_ALLOWED_SOURCES: "s3://"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - internal_net

  # ─── DB Migrate (runs once, then exits) ─────────────────────────────────────
  contento-migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://contento:contento@postgres:5432/contento}
    restart: "no"
    networks:
      - internal_net
      - shared_db_net

  # ─── Contento App (Next.js — built from repo root) ───────────────────────────
  contento-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # External shared services (Dokploy provides these)
      DATABASE_URL: ${DATABASE_URL:-postgresql://contento:contento@postgres:5432/contento}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_minio}
      IMGPROXY_ENDPOINT: http://imgproxy:8080
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      # Auth (authentik OIDC — external)
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      CONTENTO_SIGNED_URL_SECRET: ${CONTENTO_SIGNED_URL_SECRET:-}
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-contento}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET}
      DEV_AUTH: ${DEV_AUTH:-0}
      DEV_AUTH_USERNAME: ${DEV_AUTH_USERNAME:-admin}
      DEV_AUTH_PASSWORD: ${DEV_AUTH_PASSWORD:-admin}
      DEV_AUTH_SECRET: ${DEV_AUTH_SECRET:-dev-auth-secret}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    depends_on:
      contento-migrator:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    networks:
      - internal_net
      - shared_db_net


volumes:
  minio_data:
  postgres_data:
networks:
  internal_net:
    driver: bridge
  shared_db_net:
    external: true
    name: ${CONTENTO_SHARED_DB_NET:-shared_db_net}
